name: Next.js CI

on:
  push:
    branches:
      - main   # Trigger on push to main branchhhh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: Install dependencies
        id: install
        run: |
          npm install > install.log 2>&1 || exit 1

      # Step 4: Build Next.js app
      - name: Build Next.js
        id: build
        run: |
          npm run build > build.log 2>&1 || exit 1

      # Step 5: Run tests
      - name: Run tests
        id: test
        run: |
          npm test > test.log 2>&1 || exit 1

      # Step 6: Notify webhook if any step failed
      - name: Notify Webhook on Failure
        if: failure()   # Only runs if any previous step failed
        run: |
          LOGS=""
          
          # Collect logs from failed steps
          for f in install.log build.log test.log; do
            if [ -f $f ]; then
              LOGS+="$f:\n$(cat $f)\n\n"
            fi
          done

          # Send logs + failure info to Express webhook
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"status\":\"failed\",\"branch\":\"${GITHUB_REF}\",\"workflow\":\"Next.js CI\",\"logs\":\"$LOGS\"}" \
          https://links-therapy-segment-care.trycloudflare.com/webhook/github